name: Validate China4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild static pages and cost audit
        run: python3 scripts/build_site.py && python3 scripts/build_evidence.py && python3 scripts/build_bank_playbooks.py && python3 scripts/build_method_treaty.py
      - name: Verify generated files are current
        run: git diff --exit-code
      - name: Validate HTML, links, source register and calculations
        run: python3 scripts/validate_site.py && python3 scripts/validate_evidence.py && python3 scripts/validate_bank_playbooks.py && python3 scripts/validate_method_treaty.py && python3 scripts/validate_effective_dates.py && python3 scripts/validate_publication.py

