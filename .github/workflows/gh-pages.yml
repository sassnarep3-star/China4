name: Validate and deploy China4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild static pages and cost audit
        run: python3 scripts/build_site.py && python3 scripts/build_evidence.py && python3 scripts/build_bank_playbooks.py && python3 scripts/build_method_treaty.py
      - name: Verify generated files are current
        run: git diff --exit-code
      - name: Validate HTML, links, source register and calculations
        run: python3 scripts/validate_site.py && python3 scripts/validate_evidence.py && python3 scripts/validate_bank_playbooks.py && python3 scripts/validate_method_treaty.py && python3 scripts/validate_effective_dates.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Stage public site
        run: |
          mkdir _site
          cp ./*.html ./*.css _site/
          mkdir _site/data
          cp data/*.json _site/data/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
